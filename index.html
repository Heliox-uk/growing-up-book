<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprout</title>
<meta name="theme-color" content="#F6F8F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141912" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sprout">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>try{var th=localStorage.getItem('sprout-theme');if(th==='light'||th==='dark')document.documentElement.dataset.theme=th;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap">
<style>
/* Meadow theme. Layout: a family keepsake. Child chips up top, one child's page below (growth / milestones / letters),
   and a "side by side" view with a pencil-marked doorframe. */
:root{
  --bg:#F6F8F1; --surface:#FFFFFF; --sunk:#ECF0E4; --ink:#262B22; --muted:#5C6455; --line:#D4DBC8;
  --accent:#262B22; --accent-ink:#F6F8F1; --paper:#FFFFFF; --paper-line:#E3EAD6;
  --wood:#E8D9B8; --wood-edge:#CDB98E; --wood-ink:#6B5428; --danger:#B3392B; --tooth:#FFFDF7; --gum:#F4CFDA;
  --c0:#5E8C2F; --c1:#4A6FB5; --c2:#C9703A; --c3:#C2557E; --c4:#A68412;
  --p0:#DCEBC4; --p1:#D9E3F7; --p2:#FFE0CC; --p3:#F6D3E1; --p4:#FBE7A6;
  --q0:#3A4F1E; --q1:#33466E; --q2:#6E4126; --q3:#6E2F48; --q4:#665214;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141912; --surface:#1C2319; --sunk:#252E21; --ink:#E8EDE1; --muted:#A2AC97; --line:#33402D;
  --accent:#C9E3A6; --accent-ink:#1A2312; --paper:#1F271C; --paper-line:#2E3929;
  --wood:#4A3E28; --wood-edge:#5E4F34; --wood-ink:#E3CB98; --danger:#F08A7A; --tooth:#EDE8DA; --gum:#4B2C3B;
  --c0:#9CCB6B; --c1:#8FB0EE; --c2:#F0A06E; --c3:#EB8FB5; --c4:#E2C35A;
  --p0:#2C3A22; --p1:#232C40; --p2:#3D2A1F; --p3:#3A2330; --p4:#3A3317;
  --q0:#C9E3A6; --q1:#B9CBF2; --q2:#F6C3A0; --q3:#F0B5CC; --q4:#EFD889; color-scheme:dark}}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  --bg:#141912; --surface:#1C2319; --sunk:#252E21; --ink:#E8EDE1; --muted:#A2AC97; --line:#33402D;
  --accent:#C9E3A6; --accent-ink:#1A2312; --paper:#1F271C; --paper-line:#2E3929;
  --wood:#4A3E28; --wood-edge:#5E4F34; --wood-ink:#E3CB98; --danger:#F08A7A; --tooth:#EDE8DA; --gum:#4B2C3B;
  --c0:#9CCB6B; --c1:#8FB0EE; --c2:#F0A06E; --c3:#EB8FB5; --c4:#E2C35A;
  --p0:#2C3A22; --p1:#232C40; --p2:#3D2A1F; --p3:#3A2330; --p4:#3A3317;
  --q0:#C9E3A6; --q1:#B9CBF2; --q2:#F6C3A0; --q3:#F0B5CC; --q4:#EFD889; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
#app{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted);padding-inline:10px}
.btn.quiet:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}

/* Header */
.top{display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:26px}
.brand .logo{width:34px;height:34px;flex:none;align-self:center;margin-right:-2px}
.btn.theme{padding:8px;width:40px;justify-content:center}.btn.theme svg{width:18px;height:18px}
.brand .hand{font-family:var(--f-hand);font-size:22px;color:var(--muted)}
.kids{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px 7px 10px;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.chip .dot{width:12px;height:12px;border-radius:50%;background:var(--kid)}
.chip[aria-pressed="true"]{background:var(--kidp,var(--p1));color:var(--ink);border-color:transparent;font-weight:700}
.chip.cmp .dot{background:conic-gradient(var(--c0) 0 33%,var(--c1) 0 66%,var(--c2) 0)}
.chip.add{border-style:dashed;color:var(--muted);padding-left:14px}

.banner{background:var(--sunk);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner b{font-weight:700}

/* Child hero */
.hero{background:var(--kidp);border-radius:var(--r);padding:22px;display:grid;gap:18px}
.hero-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.hero h1{color:var(--ink);font-size:clamp(30px,6vw,44px);line-height:1.05}
.hero .sub{color:var(--kidq);margin-top:6px}
.hero .btn.quiet{color:var(--kidq)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0}
.stats>div{background:var(--tb);color:var(--ink);border-radius:14px;padding:12px 14px;min-width:0;--tb:var(--sunk);--tq:var(--muted)}
.stats>div:nth-child(1){--tb:var(--p4);--tq:var(--q4)}.stats>div:nth-child(2){--tb:var(--p3);--tq:var(--q3)}.stats>div:nth-child(3){--tb:var(--p1);--tq:var(--q1)}.stats>div:nth-child(4){--tb:var(--p2);--tq:var(--q2)}
.stats dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tq);font-weight:700}
.stats dd{margin:2px 0 0;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stats dd small{font-family:var(--f-body);font-size:13px;color:var(--tq)}
.stats .delta{font-size:12.5px;color:var(--tq)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:none;border:none;padding:8px 16px;font-weight:600;color:var(--muted);border-radius:999px}
.tab:hover{background:var(--sunk)}
.tab[aria-selected="true"]{color:var(--bg);background:var(--ink)}
.tab .n{font-weight:500;font-size:12px;opacity:.75;margin-left:5px}

.sec{display:flex;flex-direction:column;gap:16px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:22px}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.charts2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.charts2{grid-template-columns:minmax(0,1fr)}}
figure{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600}
figcaption span{font-weight:400;font-size:13px;color:var(--muted)}
.chart{width:100%;min-height:120px}
.chart svg{display:block}
.chart text{font-family:var(--f-body)}
.chart-empty{padding:28px 0;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;background:var(--kid)}

/* Tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
td.note{color:var(--muted);min-width:140px}
.rowbtn{background:none;border:none;color:var(--muted);font-weight:600;font-size:13px;padding:2px 6px;border-radius:6px}
.rowbtn:hover{color:var(--ink);background:var(--sunk)}

/* Milestones */
.ages{display:flex;flex-direction:column;gap:22px}
.age-group h3{font-size:17px;margin-bottom:10px;display:flex;align-items:baseline;gap:10px}
.age-group h3 span{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mlist li{--tb:var(--surface);--tq:var(--muted);background:var(--tb);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.mlist li.t-yel{--tb:var(--p4);--tq:var(--q4)}.mlist li.t-rose{--tb:var(--p3);--tq:var(--q3)}.mlist li.t-blue{--tb:var(--p1);--tq:var(--q1)}.mlist li.t-apr{--tb:var(--p2);--tq:var(--q2)}.mlist li.t-pis{--tb:var(--p0);--tq:var(--q0)}
.mlist li .rowbtn{color:var(--tq)}
.mlist .t{font-weight:600}
.mlist .d{font-size:13px;color:var(--tq);grid-column:1}
.mlist .nt{grid-column:1/-1;font-family:var(--f-hand);font-size:20px;line-height:1.3;white-space:pre-wrap}
.pill{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--surface);color:var(--tq,var(--muted));margin-left:6px;vertical-align:1px}

/* Letters */
.letters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.letters{grid-template-columns:minmax(0,1fr)}}
.letter{background:var(--paper);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--paper-line) 31px 32px);background-position:0 70px;background-repeat:no-repeat}
.letter h3{font-size:19px}
.letter .meta{font-size:13px;color:var(--muted)}
.letter .body{font-family:var(--f-hand);font-size:23px;line-height:32px;white-space:pre-wrap;overflow-wrap:anywhere}
.letter .body.clip{max-height:160px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.letter footer{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}

/* Compare */
.cmp-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.cmp-grid{grid-template-columns:minmax(0,1fr)}}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:none;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.dot-s{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--kid);margin-right:6px}

/* Welcome */
.welcome{background:var(--surface);border-radius:var(--r);padding:clamp(22px,5vw,44px);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:720px){.welcome{grid-template-columns:minmax(0,1fr)}}
.welcome h2{font-size:clamp(28px,5vw,40px);line-height:1.1;margin-bottom:12px}
.welcome p{max-width:52ch;color:var(--muted)}
.welcome .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.welcome ul{margin:16px 0 0;padding-left:18px;color:var(--muted);display:grid;gap:4px}
.mini-door{width:100%;max-width:240px;justify-self:center}

/* Dialog */
dialog{border:none;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(10,18,15,.45)}
dialog form{display:flex;flex-direction:column;gap:14px;padding:22px}
dialog h2{font-size:22px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .lbl{font-size:13px;font-weight:600}
.field .hint{font-size:12.5px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;width:100%}
.field textarea{resize:vertical;min-height:90px}
.field textarea.hand{font-family:var(--f-hand);font-size:22px;line-height:1.35;min-height:220px;background:var(--paper)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swatches{display:flex;gap:10px}
.swatches label{width:34px;height:34px;border-radius:50%;background:var(--kid);display:grid;place-items:center;cursor:pointer;border:3px solid transparent}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches input:checked+span{width:12px;height:12px;border-radius:50%;background:var(--surface)}
.swatches label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.dlg-acts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:4px}
.dlg-acts>div{display:flex;gap:8px}
.err{color:var(--danger);font-size:13.5px}
.warn{font-size:13px;color:var(--danger)}

/* Setup */
.setup{display:flex;flex-direction:column;gap:14px;max-width:760px}
.steps{margin:0;padding-left:22px;display:grid;gap:10px}
code{background:var(--sunk);padding:1px 6px;border-radius:6px;font-size:13px;overflow-wrap:anywhere}
.setup a{color:var(--c1)}

/* Photos */
.brand .spacer{flex:1}
.bdays{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.slot{aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;position:relative;background:var(--sunk);border:none;padding:0;display:block;width:100%}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .lab{position:absolute;inset:auto 0 0 0;padding:16px 8px 6px;font-size:12.5px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));text-align:left}
.slot.empty-slot{border:1.5px dashed var(--line);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted)}
.slot.empty-slot .lab{position:static;background:none;color:var(--ink);padding:0}
.slot.empty-slot span{font-size:12px}
.slot.empty-slot:hover{border-color:var(--kid)}
.mlist li.ph-item{grid-template-columns:96px minmax(0,1fr) auto;align-items:center;column-gap:12px}
.ph-btn{grid-column:1;grid-row:1/3;width:96px;height:96px;border:none;padding:0;background:none;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.ph-btn img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:8px;display:block;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ph-btn img[src^="data:image/gif"]{width:96px;height:96px;background:var(--sunk)}
.ph-item .t{grid-column:2;grid-row:1;align-self:end}
.ph-item .rowbtn{grid-column:3;grid-row:1;align-self:start}
.ph-item .d{grid-column:2;grid-row:2;align-self:start}
.lightbox{position:relative;touch-action:pan-y}
.lightbox img{width:100%;max-height:70dvh;object-fit:contain;border-radius:10px;background:var(--sunk)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:none;padding:0;display:grid;place-items:center;background:rgba(255,255,255,.88);color:#262B22;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer}
.lb-nav svg{width:22px;height:22px}
.lb-nav.prev{left:8px}.lb-nav.next{right:8px}
.lb-count{font-size:13px;color:var(--muted);text-align:center;margin-top:-6px}
/* Milestone icons */
.mi-ic{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface);color:var(--tq);vertical-align:-8px;margin-right:8px;flex:none}
.mi-ic svg{width:17px;height:17px}
/* Birthdays side by side */
.bd-cmp{display:flex;flex-direction:column;gap:14px}
.bd-cells{display:grid;grid-template-columns:repeat(var(--n),minmax(0,170px));gap:10px}
.bd-names>span{font-size:13px;font-weight:600;display:flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-row h4{font-family:var(--f-display);font-weight:400;font-size:15px;margin:0 0 6px}
.bd-cell{aspect-ratio:1;border-radius:12px;overflow:hidden;display:block;width:100%;padding:0;border:none;background:var(--sunk)}
.bd-cell img{width:100%;height:100%;object-fit:cover;display:block}
.bd-cell.none{background:transparent;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:12.5px;color:var(--muted)}
.preview{max-height:220px;width:100%;object-fit:contain;border-radius:10px;background:var(--sunk)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}
.check input{width:18px;height:18px}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.status-line{font-size:13.5px;color:var(--muted)}

/* Entry types: milestones are bold tinted cards, notes are plain with a colour bar, memories are paper */
.mlist li.ty-milestone .t{font-family:var(--f-display);font-weight:400;font-size:17px}
.mlist li.ty-note{background:var(--surface);box-shadow:inset 4px 0 0 var(--tq);padding:10px 14px 10px 18px}
.mlist li.ty-note .t{font-size:14.5px}
.mlist li.ty-note .nt{font-family:var(--f-body);font-size:14.5px;line-height:1.45;color:var(--muted)}
.mlist li.ty-memory{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--tb)}
.mlist .tn{grid-column:1/-1;font-size:13px;color:var(--tq)}
.thumbs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.th{border:none;padding:0;background:none;height:84px;display:flex;align-items:center;cursor:zoom-in}
.th img{height:84px;width:auto;max-width:150px;object-fit:contain;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.12);display:block}
.th img[src^="data:image/gif"]{width:84px;background:var(--sunk)}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-4px 0 0;padding:2px 0}
.filters::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px;white-space:nowrap;color:var(--muted)}
.fchip span{font-weight:500;opacity:.75}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* Kind-of-entry switch in forms */
.tseg{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));background:var(--sunk);border-radius:999px;padding:3px}
.tseg label{position:relative;text-align:center;padding:8px 6px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.tseg input{position:absolute;opacity:0;pointer-events:none}

function addMonths(s,n){const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1+n,d)).toISOString().slice(0,10);}

  const t=' '+String(str||'').toLowerCase()+' ';
  const jaws=[];if(/\b(bottom|lower)\b/.test(t))jaws.push('L');if(/\b(top|upper)\b/.test(t))jaws.push('U');
  const ty=[];
  if(/\b(front|central|centre|middle)\b/.test(t))ty.push('A');
  if(/\b(lateral|side)\b/.test(t))ty.push('B');
  if(/\b(canines?|eye ?teeth|eye ?tooth|fangs?)\b/.test(t))ty.push('C');
  if(/\bfirst molars?\b/.test(t))ty.push('D');
  if(/\b(second molars?|back molars?|back teeth|back tooth|last molars?)\b/.test(t))ty.push('E');
  if(!ty.includes('D')&&!ty.includes('E')&&/\bmolars?\b/.test(t))ty.push('D');
  let sides=[];if(/\bleft\b/.test(t))sides.push('L');if(/\bright\b/.test(t))sides.push('R');

const SCOPE='https://www.googleapis.com/auth/drive.appdata',BOOK='growing-up-book.json',DRIVE='https://www.googleapis.com';
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}
let clientId=CLIENT_ID||lsGet('gub-client-id')||'';
let token=null,bookId=null,queue=Promise.resolve(),photoUrls={},photoLoading={},gisP=null;
const okFid=f=>typeof f==='string'&&/^[A-Za-z0-9_-]{10,200}$/.test(f);
function boot(){
  if(location.protocol==='file:'){status='file';render();return;}

}
function loadGis(){
  if(gisP)return gisP;
  gisP=new Promise((res,rej)=>{
    if(window.google&&google.accounts&&google.accounts.oauth2)return res();
    const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;
    sc.onload=()=>res();sc.onerror=()=>{gisP=null;rej(new Error('gis'));};document.head.appendChild(sc);
  });
  return gisP;
}
function askToken(){
  return new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:clientId,scope:SCOPE,
      callback:r=>{if(r&&r.access_token){token=r.access_token;res(token);}else rej(new Error((r&&r.error)||'denied'));},
      error_callback:e=>rej(new Error((e&&e.type)||'popup'))});
    tc.requestAccessToken({prompt:lsGet('gub-connected')?'':'consent'});
  });
}
async function connect(){
  signinMsg='';
  try{
    if(!(window.google&&google.accounts&&google.accounts.oauth2))await loadGis();
    const p=askToken();status='connecting';render();
    await p;lsSet('gub-connected','1');
  }catch(e){status='signin';signinMsg='Google sign-in didn\'t finish. Check the Client ID is right, then tap the button again.';render();return;}
  status='loading';render();

  render();
}
function lock(){
  token=null;storeRecs={};bookId=null;Object.values(photoUrls).forEach(u=>URL.revokeObjectURL(u));photoUrls={};
  status='signin';signinMsg='Book locked. Everything is still safe in your Google Drive.';closeForm();render();
}
async function api(path,opts){
  opts=opts||{};
  if(!token)throw {code:'auth'};
  const r=await fetch(DRIVE+path,Object.assign({},opts,{headers:Object.assign({Authorization:'Bearer '+token},opts.headers||{})}));
  if(r.status===401){token=null;status='signin';signinMsg='Your Google session timed out. Tap the button to carry on where you left off.';closeForm();render();throw {code:'auth'};}
  if(!r.ok)throw {code:'http',status:r.status};
  return r;
}
function multipart(meta,blob){const fd=new FormData();fd.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));fd.append('file',blob);return fd;}
async function readRemote(){
  const q=encodeURIComponent("name='"+BOOK+"' and trashed=false");
  const j=await (await api('/drive/v3/files?spaces=appDataFolder&q='+q+'&orderBy=modifiedTime%20desc&fields=files(id)')).json();
  const f=j.files&&j.files[0];
  if(!f){bookId=null;return {};}
  bookId=f.id;
  const b=await (await api('/drive/v3/files/'+f.id+'?alt=media')).json();
  return b&&b.records&&typeof b.records==='object'?b.records:{};
}
async function writeRemote(records){
  const body=JSON.stringify({app:'growing-up-book',version:1,saved:new Date().toISOString(),records});
  if(bookId){await api('/upload/drive/v3/files/'+bookId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});return;}
  const r=await api('/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',body:multipart({name:BOOK,parents:['appDataFolder'],mimeType:'application/json'},new Blob([body],{type:'application/json'}))});
  bookId=(await r.json()).id;
}
/* Every change re-reads the book first, so edits made on another device aren't lost. */
function commit(ops){
  const p=queue.then(async()=>{
    const remote=await readRemote();
    ops.forEach(o=>{if(o.del)delete remote[o.id];else remote[o.id]=o.data;});
    await writeRemote(remote);storeRecs=remote;render();
  });
  queue=p.catch(()=>{});return p;
}
async function put(id,data){
  if(sample){sampleRecs[id]=data;render();return true;}
  if(status!=='ready'){toast('Open your book with Google Drive first.');return false;}
  try{await commit([{id,data}]);return true;}
  catch(e){if(!e||e.code!=='auth')toast('Couldn\'t save to Google Drive. Check your connection and try again.');return false;}
}
async function remove(id){
  const r=cur()[id];
  if(sample){if(r&&r.localUrl)URL.revokeObjectURL(r.localUrl);delete sampleRecs[id];render();return;}
  try{await commit([{id,del:true}]);}catch(e){if(!e||e.code!=='auth')toast('Couldn\'t delete. Try again.');return;}
  if(r&&r.kind==='photo'&&okFid(r.fileId))deletePhotoFile(r.fileId);

async function uploadPhoto(blob){

  return (await r.json()).id;
}
function deletePhotoFile(fid){if(okFid(fid))api('/drive/v3/files/'+fid,{method:'DELETE'}).catch(()=>{});}
async function photoBlob(fid){return (await api('/drive/v3/files/'+fid+'?alt=media')).blob();}
const PIXEL='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const photoSrc=p=>p.localUrl||photoUrls[p.fileId]||PIXEL;
function hydratePhotos(){
  document.querySelectorAll('img[data-fid]').forEach(img=>{
    const fid=img.dataset.fid;if(!okFid(fid))return;
    if(photoUrls[fid]){if(img.src!==photoUrls[fid])img.src=photoUrls[fid];return;}
    if(photoLoading[fid]||!token)return;
    photoLoading[fid]=photoBlob(fid).then(b=>{photoUrls[fid]=URL.createObjectURL(b);
      document.querySelectorAll('img[data-fid="'+fid+'"]').forEach(i=>{i.src=photoUrls[fid];});}).catch(()=>{}).finally(()=>{delete photoLoading[fid];});
  });

function isBirthdayish(dob,date){const y=Math.round(ageYears(dob,date));if(y<0)return false;return Math.abs(D(date)-D(addYears(dob,y)))<=10*864e5;}
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const s=Math.min(1,2000/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*s);cv.height=Math.round(img.naturalHeight*s);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.86));if(!b)throw new Error('encode');return b;
  }finally{URL.revokeObjectURL(url);}
}
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});}

function birthdayStrip(c,ph){
  const t=todayStr(),years=Math.max(0,Math.floor(monthsBetween(c.dob,t)/12));
  let h='';
  for(let y=years;y>=0;y--){
    const bd=addYears(c.dob,y),pk=bdayPick(c,ph,y);
    const lab=y===0?'The day you were born':ordinal(y)+' birthday';
    if(pk)h+=`<button class="slot" data-act="photo" data-nav="bday" data-id="${pk.id}" aria-label="${esc(lab)} photo"><img src="${esc(photoSrc(pk))}" data-fid="${esc(pk.fileId||'')}" alt="${esc(c.name+', '+lab)}" loading="lazy"><span class="lab">${y===0?'Born':esc(lab)}</span></button>`;
    else if(canPhotos())h+=`<button class="slot empty-slot" data-act="add-photo" data-date="${bd}" data-bday="1"><span class="lab">${y===0?'Born':esc(lab)}</span><span>${fmtDate(bd)}</span><span>+ Add photo</span></button>`;
    else h+=`<div class="slot empty-slot"><span class="lab">${y===0?'Born':esc(lab)}</span><span>${fmtDate(bd)}</span></div>`;
  }
  return `<div class="bdays">${h}</div>`;
}
function openBirthdays(cid){
  const R=cur(),c=R[cid];if(!c)return;editing=null;
  const ph=recs(R,cid,'photo',true);
  $('#frm').innerHTML=`<h2>${esc(c.name)}'s birthdays</h2><p class="muted">One photo for each birthday. Tap an empty frame to add one.</p>${birthdayStrip(Object.assign({id:cid},c),ph)}
   <div class="dlg-acts"><div></div><div><button type="button" class="btn quiet" data-act="close">Close</button></div></div>`;
  showDlg();
}
const CAT_TINT={Firsts:'t-yel',Words:'t-rose',Movement:'t-blue',Teeth:'t-pis',Health:'t-pis',School:'t-apr',Hobbies:'t-blue','Funny moments':'t-yel',
  Birthday:'t-rose',Achievement:'t-yel',Growing:'t-pis',Sleep:'t-blue',Food:'t-apr','Days out':'t-blue',Holidays:'t-blue',Celebrations:'t-rose',Family:'t-apr'};
function entryLi(c,R,e,opt){
  const ty=entryType(e),tint=CAT_TINT[e.category]||(ty==='memory'?'t-apr':ty==='note'?'t-blue':''),cat=e.category&&e.category!=='Other'?e.category:'';
  const pill=ty==='milestone'?cat:TYPES[ty].label+(cat?' · '+cat:'');
  const ph=linkedPhotos(R,e.id);
  let teeth='';
  if(opt&&opt.teeth&&e.category==='Teeth'){const tc=entryTeeth(e);
    teeth=`<div class="tn">${tc.length?(entryLost(e)?'Came out: ':'')+esc(tc.map(toothName).join(', ')):'Not on the picture yet. Tap Edit to choose the teeth.'}</div>`;}
  return `<li class="ty-${ty} ${tint}"><div class="t">${milestoneIcon(e)}${esc(e.title)}${pill?`<span class="pill">${esc(pill)}</span>`:''}</div><button class="rowbtn" data-act="edit" data-id="${e.id}">Edit</button>
    <div class="d">${fmtDate(e.date)} · ${ageText(c.dob,e.date)}</div>${teeth}${e.note?`<div class="nt">${esc(e.note)}</div>`:''}
    ${ph.length?`<div class="thumbs">${ph.map((p,i)=>`<button class="th" data-act="photo" data-nav="entry" data-id="${p.id}" aria-label="Photo ${i+1} of ${ph.length}"><img src="${esc(photoSrc(p))}" data-fid="${esc(p.fileId||'')}" alt="${esc(e.title)}" loading="lazy"></button>`).join('')}</div>`:''}</li>`;

function photoLi(c,m){

    <div class="t">${esc(m.caption||'Photo')}${m.birthday?'<span class="pill">Birthday</span>':''}</div><button class="rowbtn" data-act="edit" data-id="${m.id}">Edit</button>

const EMPTY_TL={all:'First smile, first word, a day at the beach: tap Add to keep the moments and photos you want to remember.',
  milestone:'Milestones are the big moments: firsts, birthdays and achievements.',note:'Notes are little updates, such as a health check or a new word.',
  memory:'Memories are days out, holidays and funny moments.',photo:'Photos added on their own show here. Photos added to an entry show with that entry.'};
function timelineView(c,R,mi,ph,kid){
  const solo=ph.filter(p=>isSolo(R,p)),cnt={milestone:0,note:0,memory:0};mi.forEach(e=>cnt[entryType(e)]++);
  const f=['all','milestone','note','memory','photo'].includes(view.filter)?view.filter:'all';
  const years=Math.floor(monthsBetween(c.dob,todayStr())/12)+1,got=new Set(ph.filter(p=>p.birthday).map(p=>Math.floor(monthsBetween(c.dob,p.date)/12))).size;
  let h=`<section class="sec" style="${kid}"><div class="sec-head"><h2>Timeline</h2><button class="btn quiet" data-act="bdays" data-id="${c.id}">Every birthday (${got} of ${years})</button></div>
  <div class="filters" role="group" aria-label="Show">${[['all','Everything',mi.length+solo.length],['milestone','Milestones',cnt.milestone],['note','Notes',cnt.note],['memory','Memories',cnt.memory],['photo','Photos',solo.length]].map(([k,l,n])=>`<button class="fchip" data-act="filter" data-f="${k}" aria-pressed="${f===k}">${l} <span>${n}</span></button>`).join('')}</div>`;
  const items=[...mi.filter(e=>f==='all'||entryType(e)===f),...(f==='all'||f==='photo'?solo:[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(!items.length)return h+`<div class="empty"><span class="hand">Nothing here yet.</span><span>${EMPTY_TL[f]}</span></div></section>`;
  const groups=new Map();
  items.forEach(m=>{const y=Math.max(0,Math.floor(monthsBetween(c.dob,m.date)/12));if(!groups.has(y))groups.set(y,[]);groups.get(y).push(m);});
  h+='<div class="ages">';
  [...groups.entries()].sort((a,b)=>b[0]-a[0]).forEach(([y,list])=>{
    const from=addYears(c.dob,y);
    h+=`<div class="age-group"><h3>${y===0?'First year':'Age '+y}<span>${fmtMonth(from)} – ${fmtMonth(addMonths(addYears(c.dob,y+1),-1))}</span></h3><ul class="mlist">
    ${list.map(m=>m.kind==='photo'?photoLi(c,m):entryLi(c,R,m)).join('')}</ul></div>`;
  });
  return h+'</div></section>';
}

function teethView(c,R,kid,ts){
  const labels={},states={},tips={};
  ALLT.forEach(code=>{const x=ts.st[code];if(!x){states[code]='none';tips[code]='not yet';return;}
    states[code]=x.lost?'lost':'in';const L=[];
    if(x.in)L.push([{t:fmtDate(x.in)}]);if(x.lost)L.push([{t:'out '+fmtMonth(x.lost),c:'var(--muted)'}]);labels[code]=L;
    tips[code]=(x.in?'came through '+fmtDate(x.in):'')+(x.lost?(x.in?', ':'')+'came out '+fmtDate(x.lost):'');});
  chartSpecs.mouth={type:'mouth',labels,states,tips,colW:'auto',kid:`var(--c${c.color||0})`,aria:`${c.name}'s baby teeth: ${ts.count} of 20 have come through`};
  const hist=recs(R,c.id,'milestone').filter(e=>e.category==='Teeth'||DENT_RE.test((e.title||'')+' '+(e.note||'')));
  const sub=ts.count?`${ts.count} of 20${ts.lost?', '+ts.lost+' out':''}`:'none yet';
  let h=`<section class="sec" style="${kid}"><div class="sec-head"><h2>Teeth</h2><button class="btn primary" data-act="add-tooth">${ts.count?'Add a tooth':'Add the first tooth'}</button></div>
  <figure class="card"><figcaption>Baby teeth <span>${sub}</span></figcaption>${ts.first?`<p class="muted" style="font-size:13.5px;margin-top:-4px">First tooth at ${ageText(c.dob,ts.first)} old, on ${fmtDate(ts.first)}.</p>`:''}
  <div class="chart mouth" data-chart="mouth"></div>
  <div class="tooth-key"><span><i></i>Came through</span><span><i class="nt"></i>Not yet</span>${ts.lost?'<span><i class="lo"></i>Came out</span>':''}</div>
  <p class="muted" style="font-size:13px;text-align:center">As you look at ${esc(c.name)}, so their right is on your left. Teeth come from entries in the Teeth category.</p></figure>`;
  if(!hist.length)return h+`<div class="empty"><span class="hand">Waiting for the first one.</span><span>When a tooth comes through, tap the button above and choose it on the picture.</span></div></section>`;
  h+=`<div class="age-group"><h3>Dental history<span>${pl(hist.length,'entry')}</span></h3><ul class="mlist">${hist.map(e=>entryLi(c,R,e,{teeth:true})).join('')}</ul></div>`;
  return h+'</section>';
}

function lettersView(c,le,kid){
  let h=`<section class="sec" style="${kid}"><div class="sec-head"><h2>Letters to ${esc(c.name)}</h2><button class="btn primary" data-act="add" data-kind="letter">Write a letter</button></div>`;
  if(!le.length)return h+`<div class="empty"><span class="hand">Dear ${esc(c.name)}…</span><span>Write something now for ${esc(c.name)} to read when they're older.</span></div></section>`;
  h+='<div class="letters">';
  le.forEach(l=>{
    const open=openLetters.has(l.id),long=(l.body||'').length>220||(l.body||'').split('\n').length>5;
    h+=`<article class="letter"><h3>${esc(l.title||'A letter')}</h3>
    <p class="meta">Written ${fmtDate(l.written)}, when ${esc(c.name)} was ${ageText(c.dob,l.written)} old</p>
    <div class="body${long&&!open?' clip':''}">${esc(l.body)}</div>
    <footer>${long?`<button class="btn quiet" data-act="letter" data-id="${l.id}">${open?'Fold it up':'Read the whole letter'}</button>`:''}<button class="btn quiet" data-act="edit" data-id="${l.id}">Edit</button></footer></article>`;
  });
  return h+'</div></section>';
}

function compareView(kids,R){
  const f=view.metric==='weight'?'weightKg':'heightCm',unit=view.metric==='weight'?'kg':'cm',fm=view.metric==='weight'?fmtKg:fmt1;
  const all=kids.map(k=>({k,ms:recs(R,k.id,'measure').filter(m=>typeof m[f]==='number')}));
  chartSpecs.cmp={series:all.map(({k,ms})=>({color:k.color||0,name:k.name,points:ms.map(m=>({x:ageYears(k.dob,m.date),y:m[f],t:`${k.name} · ${ageText(k.dob,m.date)} · ${fm(m[f])} ${unit}`}))})),unit,label:view.metric==='weight'?'weights':'heights',h:320};
  const hAll=kids.map(k=>({k,ms:recs(R,k.id,'measure').filter(m=>typeof m.heightCm==='number')}));
  chartSpecs.door={type:'door',h:400,people:hAll.filter(x=>x.ms.length).map(({k,ms})=>({name:k.name,color:k.color||0,marks:ms.map(m=>m.heightCm),latest:ms[ms.length-1].heightCm}))};
  // same-age table
  let maxAge=0;all.forEach(({k,ms})=>ms.forEach(m=>maxAge=Math.max(maxAge,ageYears(k.dob,m.date))));
  const rows=[];
  for(let a=0;a<=Math.floor(maxAge+0.25);a++){
    const cells=all.map(({k,ms})=>{let best=null,bd=0.26;ms.forEach(m=>{const d=Math.abs(ageYears(k.dob,m.date)-a);if(d<bd){bd=d;best=m;}});return best?fm(best[f]):null;});
    if(cells.some(x=>x!==null))rows.push({a,cells});
  }
  return `<section class="sec"><div class="sec-head"><h2>Side by side</h2>
  <div class="seg" role="group" aria-label="Measurement"><button data-act="metric" data-m="height" aria-pressed="${view.metric!=='weight'}">Height</button><button data-act="metric" data-m="weight" aria-pressed="${view.metric==='weight'}">Weight</button></div></div>
  <figure class="card"><figcaption>${view.metric==='weight'?'Weight':'Height'} by age <span>each child at the same age, not the same date</span></figcaption>
  <div class="legend">${kids.map(k=>`<span style="--kid:var(--c${k.color||0})"><i></i>${esc(k.name)}</span>`).join('')}</div>
  <div class="chart" data-chart="cmp"></div></figure>
  <div class="cmp-grid">
   <figure class="card"><figcaption>At the same age <span>nearest reading within 3 months</span></figcaption>
   ${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>Age</th>${kids.map(k=>`<th class="r"><span class="dot-s" style="--kid:var(--c${k.color||0})"></span>${esc(k.name)}</th>`).join('')}</tr></thead><tbody>
   ${rows.map(r=>`<tr><td>${r.a===0?'Birth':pl(r.a,'year')}</td>${r.cells.map(x=>`<td class="r">${x===null?'<span class="muted">—</span>':x+' '+unit}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<p class="muted">Add measurements to compare them here.</p>'}
   </figure>
   <figure class="card"><figcaption>The door frame <span>latest heights, older marks faint</span></figcaption><div class="chart" data-chart="door"></div></figure>
  </div>${teethCompare(kids,R)}${birthdaysCompare(kids,R)}</section>`;
}
function teethCompare(kids,R){
  const data=kids.map(k=>({k,ts:teethState(R,k.id)}));
  const head=`<figcaption>Teeth <span>how old each child was when each tooth came through</span></figcaption>`;
  if(!data.some(d=>d.ts.count))return `<figure class="card">${head}<p class="muted">Add teeth on each child's Teeth tab and they'll line up here.</p></figure>`;
  const labels={},states={},tips={};
  ALLT.forEach(code=>{const has=data.map(d=>d.ts.st[code]&&d.ts.st[code].in);if(!has.some(Boolean)){states[code]='none';return;}
    states[code]='in';const ln=[];
    data.forEach((d,i)=>{if(i)ln.push({t:' · ',c:'var(--muted)'});ln.push(has[i]?{t:shortAge(d.k.dob,has[i]),c:`var(--c${d.k.color||0})`,b:1}:{t:'–',c:'var(--muted)'});});
    labels[code]=[ln];tips[code]=data.map((d,i)=>d.k.name+' '+(has[i]?ageText(d.k.dob,has[i]):'not yet')).join(', ');});
  chartSpecs.tmouth={type:'mouth',labels,states,tips,colW:'auto',colMin:28*kids.length+10,aria:'Age each child got each baby tooth'};
  chartSpecs.tsteps={step:true,unit:'',label:'teeth',h:220,series:data.filter(d=>d.ts.count).map(({k,ts})=>{
    const ev={};Object.values(ts.st).forEach(x=>{if(x.in)ev[x.in]=(ev[x.in]||0)+1;});let n=0;
    const points=[{x:0,y:0,t:k.name+' · born · no teeth'}];
    Object.keys(ev).sort().forEach(dt=>{n+=ev[dt];points.push({x:ageYears(k.dob,dt),y:n,t:`${k.name} · ${ageText(k.dob,dt)} · ${plw(n,'tooth','teeth')}`});});
    return {color:k.color||0,name:k.name,points};})};
  const legend=`<div class="legend">${kids.map(k=>`<span style="--kid:var(--c${k.color||0})"><i></i>${esc(k.name)}</span>`).join('')}</div>`;
  return `<figure class="card">${head}${legend}
   <div class="chart mouth" data-chart="tmouth"></div>
   <p class="muted" style="font-size:13px;text-align:center">Ages in months (m), in the order ${esc(kids.map(k=>k.name).join(', '))}. A dash means not yet. As you look at them, so their right is on your left.</p>
   <figcaption style="margin-top:10px">Teeth by age <span>number of teeth through</span></figcaption>
   <div class="chart" data-chart="tsteps"></div></figure>`;
}
function birthdaysCompare(kids,R){
  const t=todayStr(),info=kids.map(k=>({k,ph:recs(R,k.id,'photo').filter(p=>p.birthday),age:Math.max(0,Math.floor(monthsBetween(k.dob,t)/12))}));
  const maxAge=Math.max(0,...info.map(x=>x.age));
  let rows='';
  for(let y=0;y<=maxAge;y++){
    const picks=info.map(x=>y<=x.age?bdayPick(x.k,x.ph,y):null);
    if(!picks.some(Boolean))continue;
    rows+=`<div class="bd-row"><h4>${y===0?'Born':ordinal(y)+' birthday'}</h4><div class="bd-cells">${info.map((x,i)=>{const p=picks[i];
      if(p)return `<button class="bd-cell" data-act="photo" data-nav="bday" data-id="${p.id}" aria-label="${esc(x.k.name)}, ${y===0?'born':ordinal(y)+' birthday'}"><img src="${esc(photoSrc(p))}" data-fid="${esc(p.fileId||'')}" alt="${esc(x.k.name)}" loading="lazy"></button>`;
      return `<div class="bd-cell none">${y>x.age?'Not yet':'No photo'}</div>`;}).join('')}</div></div>`;
  }
  return `<figure class="card"><figcaption>Birthdays <span>each child at the same birthday</span></figcaption>
   ${rows?`<div class="bd-cmp" style="--n:${kids.length}"><div class="bd-cells bd-names">${kids.map(k=>`<span><span class="dot-s" style="--kid:var(--c${k.color||0})"></span>${esc(k.name)}</span>`).join('')}</div>${rows}</div>`
   :'<p class="muted">Mark photos as birthday photos and they\'ll line up here by age.</p>'}</figure>`;
}

/* ---------- family home ---------- */
const kidVars=k=>{const n=k.color||0;return `--kid:var(--c${n});--kidp:var(--p${n});--kidq:var(--q${n})`;};
function nextBday(k,t){let y=Math.max(0,Math.floor(monthsBetween(k.dob,t)/12));const today=addYears(k.dob,y)===t;if(!today)y++;return {y,date:addYears(k.dob,y),today};}
const dayMonth=s=>new Date(D(s)).toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});
function kidCard(k,R,t){
  const ms=recs(R,k.id,'measure'),lh=lastWith(ms,'heightCm'),nb=nextBday(k,t);
  const pic=recs(R,k.id,'photo',true)[0],last=timelineItems(R,k.id)[0],facts=[];
  if(lh)facts.push(fmt1(lh.m.heightCm)+' cm');
  facts.push(nb.today?'Birthday today!':`${nb.y===0?'Born':ordinal(nb.y)+' birthday'} ${untilText(nb.date)}`);
  return `<button class="kcard" style="${kidVars(k)}" data-act="child" data-id="${k.id}">
   <span class="kc-ph">${pic?`<img src="${esc(photoSrc(pic))}" data-fid="${esc(pic.fileId||'')}" alt="" loading="lazy">`:esc((k.name||'?').slice(0,1))}</span>
   <span class="kc-name">${esc(k.name)}</span><span class="kc-age">${ageText(k.dob,t)} old</span>
   <span class="kc-facts">${facts.map(f=>`<span>${esc(f)}</span>`).join('')}</span>
   ${last?`<span class="kc-latest">Latest: ${esc(itemTitle(last))} · ${fmtDate(last.date)}</span>`:''}</button>`;
}
function feedItem(R,x,kmap,sub){
  const k=kmap[x.childId],thumb=x.kind==='photo'?x:x.kind==='milestone'?linkedPhotos(R,x.id)[0]:null;
  const act=x.kind==='photo'?`data-act="photo" data-id="${x.id}"`:`data-act="goto" data-id="${x.childId}" data-tab="${x.kind==='letter'?'letters':'timeline'}"`;
  return `<li><button class="feed-btn" ${act}><span class="dot-s" style="${kidVars(k)}"></span><span class="ft">${esc(itemTitle(x)||x.title||'A letter')}</span>
   <span class="fd">${sub}</span>${thumb?`<img class="fimg" src="${esc(photoSrc(thumb))}" data-fid="${esc(thumb.fileId||'')}" alt="" loading="lazy">`:''}</button></li>`;
}
function homeView(kids,R){
  const t=todayStr(),yr=+t.slice(0,4),hr=new Date().getHours(),greet=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
  const names=kids.map(k=>esc(k.name)),fam=names.length>1?names.slice(0,-1).join(', ')+' &amp; '+names[names.length-1]:names[0];
  const kmap=Object.fromEntries(kids.map(k=>[k.id,k]));
  const all=Object.entries(R).map(([id,v])=>Object.assign({id},v)).filter(v=>kmap[v.childId]);
  const ents=all.filter(v=>v.kind==='milestone'),phs=all.filter(v=>v.kind==='photo'),lets=all.filter(v=>v.kind==='letter');
  let h=`<section class="hello"><p class="hand">${greet}</p><h2>${fam}</h2><p>${[plw(ents.length,'moment','moments')+' kept',pl(phs.length,'photo'),pl(lets.length,'letter')].join(' · ')}</p></section>
  <div class="kcards">${kids.map(k=>kidCard(k,R,t)).join('')}</div>`;
  // On this day: anything from the same week in earlier years
  const otd=[...ents,...phs.filter(p=>isSolo(R,p)),...lets].map(v=>({v,dt:v.date||v.written})).filter(o=>o.dt&&+o.dt.slice(0,4)<yr&&Math.abs(D(yr+o.dt.slice(4))-D(t))<=3*864e5).sort((a,b)=>b.dt.localeCompare(a.dt));
  if(otd.length)h+=`<section class="card otd"><h2 class="ch">This week, in years gone by</h2><ul class="feed">${otd.slice(0,6).map(({v,dt})=>{const n=yr-+dt.slice(0,4);
    return feedItem(R,v,kmap,`${n===1?'A year':n+' years'} ago${dt.slice(5)===t.slice(5)?' today':', '+dayMonth(dt)} · ${esc(kmap[v.childId].name)}`);}).join('')}</ul></section>`;
  const latest=kids.flatMap(k=>timelineItems(R,k.id)).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,6);
  const bdays=kids.map(k=>({k,nb:nextBday(k,t)})).sort((a,b)=>a.nb.date.localeCompare(b.nb.date));
  const nudges=[];
  kids.forEach(k=>{const ms=recs(R,k.id,'measure'),last=ms[ms.length-1],lim=monthsBetween(k.dob,t)<60?3:6;
    if(!last)nudges.push([`${esc(k.name)} hasn't been measured yet.`,`data-act="add-for" data-kind="measure" data-child="${k.id}"`,'Measure']);
    else if(monthsBetween(last.date,t)>=lim)nudges.push([`${esc(k.name)} was last measured in ${fmtMonth(last.date)}.`,`data-act="add-for" data-kind="measure" data-child="${k.id}"`,'Measure']);});
  bdays.forEach(({k,nb})=>{const days=Math.round((D(nb.date)-D(t))/864e5);if(nb.y>0&&days<=21)nudges.push([`${esc(k.name)}'s ${ordinal(nb.y)} birthday is ${nb.today?'today':untilText(nb.date)}. Write them a letter?`,`data-act="add-for" data-kind="letter" data-child="${k.id}"`,'Write']);});

/* ---------- charts ---------- */
function nice(r){const p=Math.pow(10,Math.floor(Math.log10(r)));const f=r/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function xLabel(x){if(x===0)return '0';if(x<1)return Math.round(x*12)+'m';return (Number.isInteger(x)?x:x.toFixed(1))+'y';}
function lineChart(s,W){
  const H=s.h||240,m={l:42,r:14,t:24,b:32};
  const pts=s.series.flatMap(x=>x.points);
  if(!pts.length)return `<p class="muted chart-empty">No ${s.label} recorded yet.</p>`;
  const xmax=Math.max(0.5,...pts.map(p=>p.x));
  const xs=xmax<=1.5?0.25:xmax<=4?0.5:xmax<=10?1:2;
  const X1=Math.ceil(xmax/xs-1e-9)*xs||xs;
  let ymin=Math.min(...pts.map(p=>p.y)),ymax=Math.max(...pts.map(p=>p.y));
  if(ymax-ymin<1){ymin-=1;ymax+=1;}
  const ys=nice((ymax-ymin)/4),Y0=Math.max(0,Math.floor(ymin/ys)*ys),Y1=Math.ceil(ymax/ys)*ys;
  const sx=x=>m.l+x/X1*(W-m.l-m.r),sy=y=>H-m.b-(y-Y0)/(Y1-Y0)*(H-m.t-m.b);
  let g='';
  for(let y=Y0;y<=Y1+1e-9;y+=ys){const Y=sy(y).toFixed(1);g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y}" y2="${Y}" style="stroke:var(--line)" stroke-width="1"/><text x="${m.l-8}" y="${Y}" dy="4" text-anchor="end" font-size="11.5" style="fill:var(--muted)">${+y.toFixed(2)}</text>`;}
  const every=Math.max(1,Math.ceil((X1/xs)/Math.max(2,Math.floor((W-m.l-m.r)/52))));
  for(let i=0,x=0;x<=X1+1e-9;i++,x+=xs){if(i%every)continue;const X=sx(x).toFixed(1);g+=`<line x1="${X}" x2="${X}" y1="${H-m.b}" y2="${H-m.b+4}" style="stroke:var(--muted)"/><text x="${X}" y="${H-m.b+18}" text-anchor="middle" font-size="11.5" style="fill:var(--muted)">${xLabel(+x.toFixed(2))}</text>`;}
  g+=`<text x="${m.l-8}" y="${m.t-2}" text-anchor="end" font-size="10.5" style="fill:var(--muted)">${s.unit}</text>`;
  let marks='';
  s.series.forEach(se=>{
    const p=se.points.slice().sort((a,b)=>a.x-b.x);if(!p.length)return;
    const c=`var(--c${se.color})`;
    const d=s.step?p.map((q,i)=>i?'H'+sx(q.x).toFixed(1)+' V'+sy(q.y).toFixed(1):'M'+sx(q.x).toFixed(1)+' '+sy(q.y).toFixed(1)).join(' '):p.map((q,i)=>(i?'L':'M')+sx(q.x).toFixed(1)+' '+sy(q.y).toFixed(1)).join(' ');
    if(s.series.length===1&&p.length>1)marks+=`<path d="${d} L${sx(p[p.length-1].x).toFixed(1)} ${H-m.b} L${sx(p[0].x).toFixed(1)} ${H-m.b} Z" style="fill:${c};opacity:.1"/>`;
    marks+=`<path d="${d}" style="fill:none;stroke:${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    p.forEach((q,i)=>{const last=i===p.length-1;marks+=`<circle cx="${sx(q.x).toFixed(1)}" cy="${sy(q.y).toFixed(1)}" r="${last?5.5:3.5}" style="fill:${last?c:'var(--surface)'};stroke:${c}" stroke-width="2"><title>${esc(q.t)}</title></circle>`;});
  });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.label)} by age">${g}${marks}</svg>`;
}
function doorChart(s,W){
  const H=s.h||400,b=24,t=14,fx=46,fw=Math.min(62,W*0.2);
  if(!s.people.length)return '<p class="muted chart-empty">Add heights to see the pencil marks.</p>';
  const maxH=Math.max(...s.people.map(p=>p.latest));
  const top=s.top||Math.max(100,Math.ceil((maxH+15)/20)*20);
  const sy=v=>H-b-v/top*(H-b-t);
  let g=`<rect x="${fx}" y="${t-6}" width="${fw}" height="${H-b-t+6}" style="fill:var(--wood);stroke:var(--wood-edge)" stroke-width="1.5"/>`;
  g+=`<rect x="${fx+fw}" y="${t-6}" width="10" height="${H-b-t+6}" style="fill:var(--wood-edge);opacity:.6"/>`;
  g+=`<line x1="0" x2="${W}" y1="${H-b}" y2="${H-b}" style="stroke:var(--muted)" stroke-width="1.5"/>`;
  for(let v=0;v<=top;v+=10){const Y=sy(v).toFixed(1),major=v%50===0;
    g+=`<line x1="${fx}" x2="${fx+(major?12:7)}" y1="${Y}" y2="${Y}" style="stroke:var(--wood-ink)" stroke-width="1"/>`;
    if(major||top<=140&&v%20===0)g+=`<text x="${fx-6}" y="${Y}" dy="4" text-anchor="end" font-size="11" style="fill:var(--muted)">${v}</text>`;}
  g+=`<text x="${fx-6}" y="${t+2}" text-anchor="end" font-size="10.5" style="fill:var(--muted)">cm</text>`;
  s.people.forEach(p=>p.marks.slice(0,-1).forEach(v=>{const Y=sy(v).toFixed(1);g+=`<line x1="${fx+fw*0.2}" x2="${fx+fw-4}" y1="${Y}" y2="${Y}" style="stroke:var(--c${p.color});opacity:.35" stroke-width="1.5"/>`;}));
  const lab=s.people.map(p=>({p,y:sy(p.latest)})).sort((a,b)=>a.y-b.y);
  lab.forEach((o,i)=>{o.ly=(i&&o.y-lab[i-1].ly<24)?lab[i-1].ly+24:o.y;});
  lab.forEach(o=>{const c=`var(--c${o.p.color})`,Y=o.y.toFixed(1),LY=o.ly.toFixed(1),lx=fx+fw+18;
    g+=`<path d="M${fx+3} ${Y} L${fx+fw+4} ${Y} L${lx-4} ${LY}" style="fill:none;stroke:${c}" stroke-width="2.4" stroke-linecap="round"/>`;
    g+=`<text x="${lx}" y="${LY}" dy="6" font-size="22" style="fill:${c};font-family:var(--f-hand);font-weight:700">${esc(o.p.name)} <tspan font-size="18" style="fill:var(--muted);font-weight:500">${o.p.name.startsWith('Age')?'':fmt1(o.p.latest)+' cm'}</tspan></text>`;});
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Heights marked on a door frame">${g}</svg>`;
}

    if(ed.removed.has(p.id)){ops.push({id:p.id,del:true});gone.push(R[p.id]);}
    else ops.push({id:p.id,data:Object.assign({},R[p.id],{date:data.date,caption:data.title,birthday:bday})});});
  const btn=$('#frm button[type="submit"]'),n=ed.newPhotos.length;
  for(let i=0;i<n;i++){
    const pd={kind:'photo',childId:data.childId,date:data.date,caption:data.title,birthday:bday,entryId:nid};
    if(sample)pd.localUrl=ed.newPhotos[i].url;
    else{btn.disabled=true;btn.textContent=n>1?`Uploading ${i+1} of ${n}…`:'Uploading…';
      try{pd.fileId=await uploadPhoto(ed.newPhotos[i].blob);}
      catch(e){btn.disabled=false;btn.textContent=ed.id?'Save changes':'Add';fail(e&&e.code==='http'&&e.status===403?'Your Google Drive may be full. Free up some space, then try again.':'A photo didn\'t upload. Check your connection and try again.');return false;}}
    ops.push({id:newId('photo'),data:pd});
  }
  const ok=await putMany(ops);
  if(ok){gone.forEach(p=>{if(p.localUrl&&sample)URL.revokeObjectURL(p.localUrl);if(!sample&&okFid(p.fileId))deletePhotoFile(p.fileId);});
    if(!sample)ed.newPhotos.forEach(x=>URL.revokeObjectURL(x.url));}
  return ok;
}
function showDlg(){setTimeout(hydratePhotos,0);const dlg=$('#dlg');if(dlg.open)return;if(typeof dlg.showModal==='function')dlg.showModal();else dlg.setAttribute('open','');}

const CHEV=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
function openPhoto(id,nav){
  const R=cur(),p=R[id];if(!p)return;const c=R[p.childId],ent=p.entryId&&R[p.entryId];editing=null;
  let arrows='',count='',pre='',back='',list=null;
  if(nav==='bday'&&p.birthday&&c)list=bdayList(R,p.childId);
  else if(nav==='entry'&&ent)list=linkedPhotos(R,p.entryId);
  if(list){
    const i=list.findIndex(x=>x.id===id),prev=list[i-1],next=list[i+1],what=nav==='bday'?'birthday photo':'photo';
    if(prev)arrows+=`<button type="button" class="lb-nav prev" data-act="photo" data-nav="${nav}" data-id="${prev.id}" aria-label="Previous ${what}">${CHEV('M15 5l-7 7 7 7')}</button>`;
    if(next)arrows+=`<button type="button" class="lb-nav next" data-act="photo" data-nav="${nav}" data-id="${next.id}" aria-label="Next ${what}">${CHEV('M9 5l7 7-7 7')}</button>`;
    if(list.length>1)count=`<p class="lb-count">${i+1} of ${list.length} ${what}s</p>`;
    pre=[prev,next].filter(x=>x&&x.fileId).map(x=>`<img hidden alt="" data-fid="${esc(x.fileId)}">`).join('');
    if(nav==='bday')back=`<button type="button" class="btn quiet" data-act="bdays" data-id="${p.childId}">All birthdays</button>`;
  }
  const ttl=ent?ent.title:(p.caption||(c?c.name:'Photo'));
  $('#frm').innerHTML=`<div class="lightbox"><img src="${esc(photoSrc(p))}" data-fid="${esc(p.fileId||'')}" alt="${esc(ttl)}">${arrows}</div>${count}${pre}
   <h2>${esc(ttl)}</h2><p class="muted">${fmtDate(p.date)}${c?' · '+esc(c.name)+' was '+ageText(c.dob,p.date)+' old':''}${p.birthday?' · birthday photo':''}${ent?' · '+TYPES[entryType(ent)].label.toLowerCase():''}</p>
   <div class="dlg-acts"><div>${back}</div><div><button type="button" class="btn quiet" data-act="close">Close</button><button type="button" class="btn primary" data-act="edit" data-id="${ent?p.entryId:id}">Edit</button></div></div>`;
  showDlg();
}
document.addEventListener('keydown',e=>{
  const tg=e.target&&e.target.closest&&e.target.closest('[data-act="tooth"]');
  if(tg&&(e.key==='Enter'||e.key===' ')){e.preventDefault();tg.dispatchEvent(new MouseEvent('click',{bubbles:true,detail:0}));return;}
  if(!$('#dlg').open||!$('#frm .lightbox'))return;
  const b=e.key==='ArrowLeft'?$('#frm .lb-nav.prev'):e.key==='ArrowRight'?$('#frm .lb-nav.next'):null;
  if(b){e.preventDefault();b.click();}
});
let swipeX=null,swipeY=null;
$('#frm').addEventListener('touchstart',e=>{if(!e.target.closest('.lightbox')||e.touches.length!==1){swipeX=null;return;}swipeX=e.touches[0].clientX;swipeY=e.touches[0].clientY;},{passive:true});
$('#frm').addEventListener('touchend',e=>{
  if(swipeX===null)return;const t=e.changedTouches[0],dx=t.clientX-swipeX,dy=t.clientY-swipeY;swipeX=null;
  if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.5)return;
  const b=$(dx<0?'#frm .lb-nav.next':'#frm .lb-nav.prev');if(b)b.click();
},{passive:true});

let pendingRestore=null;
function openBackup(){
  editing=null;pendingRestore=null;let last=null;try{last=localStorage.getItem('gub-last-backup');}catch(e){}
  const n=Object.keys(storeRecs).length,np=Object.values(storeRecs).filter(r=>r.kind==='photo').length;
  $('#frm').innerHTML=`<h2>Back up your book</h2>
   <p>Save everything in your book (${pl(n,'entry')}, including ${pl(np,'photo')}) as one file. Keep it somewhere safe, such as Google Drive, and restore it here if you ever need to.</p>
   <p class="status-line">Last backup from this device: ${last?fmtDate(last):'none yet'}</p>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn primary" data-act="do-backup" ${n?'':'disabled'}>Download backup</button>
   <span class="btn file-btn">Restore from a file<input type="file" id="f-restore" accept=".json,application/json" aria-label="Restore from a backup file"></span></div>
   <p class="status-line" id="bk-status" aria-live="polite"></p><div id="bk-confirm" style="display:flex;flex-direction:column;gap:10px;align-items:flex-start"></div>
   <div class="dlg-acts"><div></div><div><button type="button" class="btn quiet" data-act="close">Close</button></div></div>`;
  showDlg();
  $('#f-restore').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)readRestore(f);});
}
async function doBackup(btn){
  const st=$('#bk-status');btn.disabled=true;
  const list=Object.values(storeRecs).filter(r=>r.kind==='photo'&&okFid(r.fileId)),photos={};let i=0;
  for(const p of list){i++;st.textContent=`Gathering photos (${i} of ${list.length})…`;
    try{photos[p.fileId]=await blobToDataURL(photoUrls[p.fileId]?await (await fetch(photoUrls[p.fileId])).blob():await photoBlob(p.fileId));}catch(e){}}
  const missing=list.length-Object.keys(photos).length;
  const out=JSON.stringify({app:'growing-up-book',version:1,exported:new Date().toISOString(),records:storeRecs,photos});
  st.textContent='Ready to save.';
  try{
    const u=URL.createObjectURL(new Blob([out],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='sprout-backup-'+todayStr()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
    try{localStorage.setItem('gub-last-backup',todayStr());}catch(e){}
    st.textContent='Backup saved.'+(missing?` ${pl(missing,'photo')} couldn't be included.`:'');
  }catch(e){st.textContent='The backup couldn\'t be saved. Try again.';}
  btn.disabled=false;
}
async function readRestore(file){
  const st=$('#bk-status'),cf=$('#bk-confirm');cf.innerHTML='';pendingRestore=null;
  let j;try{j=JSON.parse(await file.text());}catch(e){j=null;}
  if(!j||j.app!=='growing-up-book'||!j.records||typeof j.records!=='object'){st.textContent='That file isn\'t a Sprout backup.';return;}
  const KINDS=['child','measure','milestone','letter','photo'],clean={};
  for(const [id,r] of Object.entries(j.records)){
    if(!/^[A-Za-z0-9_\-.~:@+]{1,120}$/.test(id)||!r||typeof r!=='object'||!KINDS.includes(r.kind))continue;
    const o={};for(const [k,v] of Object.entries(r)){if(k==='localUrl'||!/^[A-Za-z]{1,40}$/.test(k))continue;
      if(typeof v==='string')o[k]=v.slice(0,20000);else if((typeof v==='number'&&isFinite(v))||typeof v==='boolean'||v===null)o[k]=v;}
    clean[id]=o;
  }
  const n=Object.keys(clean).length,nk=Object.values(clean).filter(r=>r.kind==='child').length;
  if(!n){st.textContent='That backup is empty.';return;}
  pendingRestore={records:clean,photos:j.photos&&typeof j.photos==='object'?j.photos:{}};
  const when=typeof j.exported==='string'&&/^\d{4}-\d\d-\d\d/.test(j.exported)?' from '+fmtDate(j.exported.slice(0,10)):'';
  st.textContent=`This backup${when} has ${pl(nk,'child')} and ${pl(n,'entry')} in total.`;
  cf.innerHTML=`<p class="status-line">Restoring adds these to your book. An entry that's already here is replaced by the version in the backup.</p><button type="button" class="btn primary" data-act="do-restore">Restore ${pl(n,'entry')}</button>`;
}
async function doRestore(btn){
  if(!pendingRestore||status!=='ready')return;btn.disabled=true;
  const st=$('#bk-status'),{records,photos}=pendingRestore,ids=Object.keys(records),ops=[];let lost=0,i=0;
  for(const id of ids){
    const r=Object.assign({},records[id]);i++;
    if(r.kind==='photo'){
      const key=r.fileId||r.assetId,ex=storeRecs[id];delete r.assetId;
      if(!(ex&&ex.fileId&&ex.fileId===r.fileId)){
        const du=photos[key],b=typeof du==='string'&&/^data:image\/(jpeg|png|webp|gif);base64,/.test(du)?dataURLToBlob(du):null;
        if(!b){lost++;continue;}
        st.textContent=`Uploading photos to Google Drive… ${i} of ${ids.length}`;
        try{r.fileId=await uploadPhoto(b);}catch(e){lost++;continue;}
      }
    }
    ops.push({id,data:r});
  }
  st.textContent='Saving to Google Drive…';
  try{await commit(ops);}catch(e){st.textContent='The restore didn\'t finish. Check your connection and try again.';btn.disabled=false;return;}
  pendingRestore=null;$('#bk-confirm').innerHTML='';
  st.textContent=`Restored ${pl(ops.length,'entry')}.`+(lost?` ${pl(lost,'photo')} couldn't be restored.`:'');
}

function closeForm(){const d=$('#dlg');if(d.open)d.close();editing=null;}
function fail(m){const e=$('#f-err');e.textContent=m;e.hidden=false;}

$('#frm').addEventListener('submit',async ev=>{
  ev.preventDefault();if(!editing)return;
  const {kind,id,childId}=editing,R=cur(),v=s=>($(s)?.value||'').trim();let data;
  if(kind==='child'){
    const name=v('#f-name'),dob=v('#f-dob');if(!name)return fail('Add a name.');if(!dob)return fail('Add a date of birth.');
    const c=document.querySelector('input[name="f-color"]:checked');data={kind,name,dob,color:c?+c.value:0};
  }else if(kind==='measure'){
    const date=v('#f-date'),hs=v('#f-h'),ws=v('#f-w');if(!date)return fail('Add the date it was measured.');
    if(!hs&&!ws)return fail('Add a height, a weight, or both.');
    const hc=hs?parseFloat(hs):null,wk=ws?parseFloat(ws):null;
    if(hs&&!(hc>=20&&hc<=250))return fail('Height should be in centimetres, between 20 and 250.');
    if(ws&&!(wk>=0.5&&wk<=200))return fail('Weight should be in kilograms, between 0.5 and 200.');
    data={kind,childId,date,note:v('#f-note')};if(hc!==null)data.heightCm=hc;if(wk!==null)data.weightKg=wk;
  }else if(kind==='milestone'){
    const title=v('#f-title'),date=v('#f-date');if(!title)return fail('Say what happened.');if(!date)return fail('Add a date.');
    const typ=(document.querySelector('input[name="f-type"]:checked')||{}).value||'milestone',cat=v('#f-cat');
    data={kind,childId,title,date,category:cat,note:$('#f-note').value.trim(),type:typ};
    if(cat==='Teeth'){if(editing.teeth.size)data.teeth=ALLT.filter(c=>editing.teeth.has(c)).join(',');data.toothLost=!!editing.toothLost;}
  }else if(kind==='photo'){
    const date=v('#f-date'),old=id?R[id]:null;
    if(!date)return fail('Add the date the photo was taken.');
    if(!editing.blob&&!old)return fail('Choose a photo first.');
    data={kind,childId,date,caption:v('#f-cap'),birthday:$('#f-bday').checked};
    if(editing.blob){
      if(sample){data.localUrl=URL.createObjectURL(editing.blob);}
      else{
        const btn=$('#frm button[type="submit"]');btn.disabled=true;btn.textContent='Uploading…';
        try{data.fileId=await uploadPhoto(editing.blob);}
        catch(e){btn.disabled=false;btn.textContent=id?'Save changes':'Add';return fail(e&&e.code==='http'&&e.status===403?'Your Google Drive may be full. Free up some space, then try again.':'The photo didn\'t upload. Check your connection and try again.');}
      }
    }else{if(old.fileId)data.fileId=old.fileId;if(old.localUrl)data.localUrl=old.localUrl;}
    if(editing.blob&&old){if(old.fileId&&!sample)editing.oldAsset=old.fileId;if(old.localUrl)URL.revokeObjectURL(old.localUrl);}
  }else{
    const body=$('#f-body').value.replace(/\s+$/,''),written=v('#f-written');
    if(body.replace(/^Dear [^\n]*,?\s*/,'').trim().length===0)return fail('Write something in the letter first.');
    if(!written)return fail('Add the date you wrote it.');
    data={kind,childId,title:v('#f-title'),body,written};
  }
  const nid=id||newId(kind),oa=editing.oldAsset;
  const ok=kind==='milestone'?await saveEntry(nid,data):await put(nid,data);
  if(ok&&oa)deletePhotoFile(oa);
  if(!ok){const btn=$('#frm button[type="submit"]');if(btn){btn.disabled=false;btn.textContent=id?'Save changes':'Add';}}
  if(ok){closeForm();if(kind==='child'){view.child=nid;if(!id)view.tab='growth';}else if(view.child!=='home'&&!(kind==='milestone'&&view.tab==='teeth')){view.tab=kind==='measure'?'growth':kind==='letter'?'letters':'timeline';}
    if(kind==='milestone'&&!id&&view.tab==='timeline'&&view.filter!=='all'&&view.filter!==data.type)view.filter='all';
    render();toast(id?'Saved':kind==='child'?data.name+' added':kind==='letter'?'Letter saved':kind==='photo'?'Photo added':TYPES[data.type].label+' added');}
});

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='theme'){setTheme();render();return;}
  if(a==='child'){view.child=b.dataset.id;render();window.scrollTo(0,0);}
  else if(a==='home'){view.child='home';render();window.scrollTo(0,0);}
  else if(a==='compare'){view.child='compare';render();window.scrollTo(0,0);}
  else if(a==='goto'){view.child=b.dataset.id;view.tab=b.dataset.tab||'timeline';view.filter='all';render();window.scrollTo(0,0);}
  else if(a==='filter'){view.filter=b.dataset.f;render();}
  else if(a==='chooser'){openChooser();}
  else if(a==='choose-kid'){if(editing&&editing.kind==='chooser'){editing.childId=b.dataset.id;$('#frm').innerHTML=chooserHtml();}}
  else if(a==='choose'){if(!editing||editing.kind!=='chooser')return;const cid=editing.childId,ty=b.dataset.type;
    if(ty==='photo')openForm('photo',null,{childId:cid});else openForm('milestone',null,{type:ty,childId:cid});}
  else if(a==='add-for'){openForm(b.dataset.kind,null,{childId:b.dataset.child});}
  else if(a==='add-tooth'){const n=teethState(cur(),view.child).count;openForm('milestone',null,n?{type:'note',category:'Teeth',title:'New tooth'}:{type:'milestone',category:'Teeth',title:'First tooth'});}
  else if(a==='tooth'){if(!editing||!editing.teeth)return;const c=b.dataset.code;editing.teeth.has(c)?editing.teeth.delete(c):editing.teeth.add(c);renderPicker();
    const nb=$(`#f-picker [data-code="${c}"]`);if(nb&&ev.detail===0)nb.focus();}
  else if(a==='att-del'){if(!editing||!editing.newPhotos)return;
    if(b.dataset.pid)editing.removed.add(b.dataset.pid);else{const [x]=editing.newPhotos.splice(+b.dataset.new,1);if(x&&!sample)URL.revokeObjectURL(x.url);}renderAtt();}
  else if(a==='tab'){view.tab=b.dataset.tab;render();}
  else if(a==='metric'){view.metric=b.dataset.m;render();}
  else if(a==='add'){openForm(b.dataset.kind,null);}
  else if(a==='add-photo'){openForm('photo',null,b.dataset.date?{date:b.dataset.date,bday:!!b.dataset.bday}:null);}
  else if(a==='photo'){openPhoto(b.dataset.id,b.dataset.nav);}
  else if(a==='backup'){openBackup();}
  else if(a==='bdays'){openBirthdays(b.dataset.id);}
  else if(a==='connect'){connect();}
  else if(a==='lock'){lock();}
  else if(a==='setup-edit'){status='setup';render();}
  else if(a==='copy-origin'){try{await navigator.clipboard.writeText(location.origin);toast('Copied');}catch(e){toast('Select the address and copy it');}}
  else if(a==='setup-save'){
    const v=($('#f-client').value||'').trim(),er=$('#setup-err');
    if(!/^[A-Za-z0-9-]+\.apps\.googleusercontent\.com$/.test(v)){er.textContent='That doesn\'t look like a Client ID. It should end in .apps.googleusercontent.com.';er.hidden=false;return;}
    clientId=v;lsSet('gub-client-id',v);status='signin';signinMsg='';render();loadGis().catch(()=>{});
  }

  else if(a==='do-backup'){doBackup(b);}
  else if(a==='do-restore'){doRestore(b);}
  else if(a==='edit'){const R=cur(),r=R[b.dataset.id];if(!r)return;if(r.kind==='photo'&&r.entryId&&R[r.entryId])openForm('milestone',r.entryId);else openForm(r.kind,b.dataset.id);}
  else if(a==='letter'){const id=b.dataset.id;openLetters.has(id)?openLetters.delete(id):openLetters.add(id);render();}
  else if(a==='sample-on'){sampleRecs=buildSample();sample=true;view.child='home';view.tab='growth';render();}
  else if(a==='sample-off'){sample=false;sampleRecs=null;view.child='home';render();}
  else if(a==='close'){closeForm();}
  else if(a==='delete'){
    if(!editing)return;
    if(!deleteArmed){deleteArmed=true;b.classList.add('armed');b.textContent='Tap again to delete';const w=$('#del-warn');if(w)w.hidden=false;return;}
    const {kind,id}=editing;closeForm();
    if(kind==='child'){const kids=Object.entries(cur()).filter(([,v])=>v.childId===id).map(([k])=>k);for(const k of kids)await remove(k);}
    if(kind==='milestone'){const lp=linkedPhotos(cur(),id).map(p=>cur()[p.id]);
      if(await putMany([{id,del:true},...linkedPhotos(cur(),id).map(p=>({id:p.id,del:true}))]))lp.forEach(p=>{if(sample&&p.localUrl)URL.revokeObjectURL(p.localUrl);if(!sample&&okFid(p.fileId))deletePhotoFile(p.fileId);});
      render();toast('Deleted');return;}
    await remove(id);if(view.child===id)view.child=null;render();toast('Deleted');
  }
});
$('#dlg').addEventListener('close',()=>{editing=null;});

boot();
})();
